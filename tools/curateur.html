<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Curves — curateur d'affirmations</title>
<style>
  :root{
    --bg:#0A0A0A; --card:#161615; --ink:#F4F4F1; --dim:#8B8B87;
    --hair:rgba(244,244,241,.15); --accent:#E0A96D;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px}
  h1{font-weight:300;font-size:22px;letter-spacing:.5px;margin:0 0 4px}
  .sub{color:var(--dim);font-size:13px;margin:0 0 18px}
  .counter{color:var(--dim);font-size:13px;margin-bottom:14px}
  .counter b{color:var(--accent)}
  .card{width:min(92vw,460px);min-height:280px;background:var(--card);
    border:1px solid var(--hair);border-radius:22px;padding:26px;display:flex;
    flex-direction:column;gap:16px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
  .quote{font-size:44px;line-height:0;color:var(--accent);opacity:.35;height:26px;font-weight:700}
  .text{font-size:21px;line-height:1.45;font-weight:300;flex:1}
  .author{color:var(--accent);font-size:15px;font-style:italic}
  .selectors{display:flex;gap:10px;flex-wrap:wrap}
  select{background:#000;color:var(--ink);border:1px solid var(--hair);
    border-radius:10px;padding:8px 10px;font-size:13px}
  .themes{display:flex;gap:6px;flex-wrap:wrap}
  .chip{border:1px solid var(--hair);border-radius:20px;padding:5px 10px;font-size:12px;
    color:var(--dim);cursor:pointer;user-select:none}
  .chip.on{border-color:var(--accent);color:var(--accent)}
  .actions{display:flex;gap:16px;margin-top:22px}
  .btn{width:64px;height:64px;border-radius:50%;border:1px solid var(--hair);
    background:var(--card);color:var(--ink);font-size:24px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;transition:transform .1s}
  .btn:active{transform:scale(.92)}
  .btn.keep{border-color:var(--accent);color:var(--accent)}
  .hint{color:var(--dim);font-size:12px;margin-top:14px}
  .bar{display:flex;gap:10px;margin-top:18px}
  .bar button{background:none;border:1px solid var(--hair);color:var(--dim);
    border-radius:20px;padding:8px 14px;font-size:12px;cursor:pointer}
  #out{width:min(92vw,720px);margin-top:20px;display:none}
  textarea{width:100%;height:280px;background:#000;color:var(--ink);border:1px solid var(--hair);
    border-radius:12px;padding:14px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
  .done{text-align:center;color:var(--dim);font-size:15px;margin-top:30px}
  .warn{color:#E0A96D;font-size:12px;max-width:460px;text-align:center;margin-top:16px;opacity:.8}
</style>
</head>
<body>
  <h1>curves · curateur</h1>
  <p class="sub">garde ou jette — les gardées deviennent ton SQL Supabase</p>
  <div class="counter" id="counter"></div>

  <div id="stage"></div>

  <div class="actions" id="actions">
    <button class="btn" onclick="decide(false)" title="jeter (←)">✗</button>
    <button class="btn keep" onclick="decide(true)" title="garder (→)">♥</button>
  </div>
  <div class="hint">← jeter · → garder · les menus ajustent catégorie / ton / thèmes avant de garder</div>

  <div class="bar">
    <button onclick="exportSql()">exporter le SQL</button>
    <button onclick="if(confirm('Recommencer depuis le début ?')){kept=[];i=0;render();}">recommencer</button>
  </div>
  <p class="warn">⚠️ Vérifie les citations : certaines attributions populaires sont incertaines. Jette celles dont tu n'es pas sûr.</p>

  <div id="out">
    <textarea id="sql" readonly></textarea>
    <div class="bar"><button onclick="copySql()">copier</button></div>
  </div>

<script>
const CATS = ["general","mindset","action","focus","resilience","confidence","vision","citations"];
const TONES = ["direct","doux","poetique","percutant"];
const THEMES = ["travail","famille","relations","sante","argent"];

// Pool à trier. th = thèmes (souvent vide), a = auteur (citations).
const POOL = [
  // ── Général ──
  {c:"Aujourd'hui est une page vierge, à toi de l'écrire.",cat:"general",t:"doux"},
  {c:"Je fais de mon mieux, et c'est déjà beaucoup.",cat:"general",t:"doux"},
  {c:"Un petit pas aujourd'hui vaut mieux qu'un grand demain.",cat:"general",t:"direct"},
  {c:"Je mérite le temps que je prends pour moi.",cat:"general",t:"doux"},
  {c:"Ce moment ne reviendra pas — vis-le pleinement.",cat:"general",t:"poetique"},
  {c:"Respire. Tout ne se joue pas maintenant.",cat:"general",t:"doux"},
  {c:"Avance. Le reste suivra.",cat:"general",t:"percutant"},
  {c:"Chaque jour est une nouvelle chance de bien faire.",cat:"general",t:"doux"},
  {c:"Je choisis de voir ce qui va, pas seulement ce qui manque.",cat:"general",t:"doux"},
  {c:"Ma valeur ne dépend pas de ma productivité.",cat:"general",t:"doux"},
  {c:"Fais simple. Fais maintenant.",cat:"general",t:"percutant"},
  {c:"Je suis exactement là où je dois apprendre.",cat:"general",t:"poetique"},

  // ── Mindset ──
  {c:"Mes pensées ne sont pas des faits.",cat:"mindset",t:"direct"},
  {c:"L'échec n'est pas le contraire du succès, c'en est le chemin.",cat:"mindset",t:"direct"},
  {c:"Je peux changer d'avis, c'est une force.",cat:"mindset",t:"doux"},
  {c:"Ce que je me répète, je le deviens.",cat:"mindset",t:"poetique"},
  {c:"Le problème n'est pas l'obstacle, c'est le regard que je pose dessus.",cat:"mindset",t:"direct"},
  {c:"Je remplace « je dois » par « je choisis ».",cat:"mindset",t:"direct"},
  {c:"Comparer ma page 1 à la page 20 d'un autre n'a aucun sens.",cat:"mindset",t:"direct"},
  {c:"Je ne suis pas mes erreurs, j'en suis l'élève.",cat:"mindset",t:"doux"},
  {c:"Chaque « non » me rapproche du bon « oui ».",cat:"mindset",t:"percutant"},
  {c:"Mon esprit est un jardin : je choisis ce que j'y sème.",cat:"mindset",t:"poetique"},

  // ── Action ──
  {c:"Ne pas être prêt n'est pas une raison pour ne pas commencer.",cat:"action",t:"direct"},
  {c:"Commence petit, mais commence.",cat:"action",t:"percutant"},
  {c:"La motivation vient en agissant, pas avant.",cat:"action",t:"direct"},
  {c:"Fait vaut mieux que parfait.",cat:"action",t:"percutant"},
  {c:"Une décision imparfaite vaut mieux qu'une hésitation parfaite.",cat:"action",t:"direct"},
  {c:"Je transforme l'envie en premier geste.",cat:"action",t:"direct"},
  {c:"Cinq minutes suffisent pour lancer la machine.",cat:"action",t:"doux"},
  {c:"Arrête d'attendre le bon moment. Crée-le.",cat:"action",t:"percutant"},
  {c:"Chaque action, même minuscule, compte.",cat:"action",t:"doux"},
  {c:"Le plus dur, c'est de commencer. Alors commence.",cat:"action",t:"percutant"},
  {c:"Au travail, une tâche à la fois suffit.",cat:"action",t:"direct",th:["travail"]},

  // ── Focus ──
  {c:"Une chose à la fois, pleinement.",cat:"focus",t:"percutant"},
  {c:"Ce qui n'est pas essentiel peut attendre.",cat:"focus",t:"direct"},
  {c:"Mon attention est ma ressource la plus précieuse.",cat:"focus",t:"direct"},
  {c:"Je protège mon énergie des distractions.",cat:"focus",t:"direct"},
  {c:"Moins, mais mieux.",cat:"focus",t:"percutant"},
  {c:"Le calme aussi est une forme de progrès.",cat:"focus",t:"poetique"},
  {c:"Je reviens à l'instant présent, encore et encore.",cat:"focus",t:"doux"},
  {c:"Fermer les onglets, ouvrir l'esprit.",cat:"focus",t:"percutant",th:["travail"]},
  {c:"Ce sur quoi je me concentre grandit.",cat:"focus",t:"poetique"},

  // ── Résilience ──
  {c:"Je suis plus solide que ce qui essaie de me briser.",cat:"resilience",t:"percutant"},
  {c:"Cette difficulté est temporaire, pas définitive.",cat:"resilience",t:"doux"},
  {c:"J'ai déjà survécu à 100% de mes pires journées.",cat:"resilience",t:"direct"},
  {c:"Tomber fait partie du chemin. Se relever aussi.",cat:"resilience",t:"doux"},
  {c:"Après la tempête, je pousse plus profond mes racines.",cat:"resilience",t:"poetique"},
  {c:"Ma sensibilité n'est pas une faiblesse.",cat:"resilience",t:"doux"},
  {c:"Je n'ai pas à tout porter en même temps.",cat:"resilience",t:"doux"},
  {c:"Ce qui me coûte aujourd'hui me construit pour demain.",cat:"resilience",t:"direct"},
  {c:"Prendre soin de moi n'est pas égoïste.",cat:"resilience",t:"doux",th:["sante"]},
  {c:"Je m'autorise à souffler quand j'en ai besoin.",cat:"resilience",t:"doux",th:["sante"]},

  // ── Confiance ──
  {c:"Je n'ai pas besoin de la permission des autres pour avancer.",cat:"confidence",t:"direct"},
  {c:"Ma voix compte, même si elle tremble.",cat:"confidence",t:"doux"},
  {c:"Je suis capable de bien plus que je ne le crois.",cat:"confidence",t:"doux"},
  {c:"Je prends ma place, pleinement.",cat:"confidence",t:"percutant"},
  {c:"Le doute n'a pas le dernier mot.",cat:"confidence",t:"direct"},
  {c:"Je me parle comme à quelqu'un que j'aime.",cat:"confidence",t:"doux"},
  {c:"Je n'ai rien à prouver, juste à être.",cat:"confidence",t:"poetique"},
  {c:"Mes idées valent la peine d'être entendues.",cat:"confidence",t:"doux",th:["travail"]},
  {c:"J'avance même sans être sûr — c'est ça, le courage.",cat:"confidence",t:"direct"},
  {c:"Je m'aime aussi les jours où c'est moins facile.",cat:"confidence",t:"doux",th:["relations"]},

  // ── Vision ──
  {c:"Je construis aujourd'hui la vie que je veux demain.",cat:"vision",t:"direct"},
  {c:"Mes rêves méritent que je m'y mette vraiment.",cat:"vision",t:"doux"},
  {c:"Je vise loin, j'avance près.",cat:"vision",t:"poetique"},
  {c:"Chaque choix me rapproche ou m'éloigne de mon cap. Je choisis.",cat:"vision",t:"direct"},
  {c:"Ce que j'imagine avec clarté, je peux le bâtir.",cat:"vision",t:"poetique"},
  {c:"Je plante aujourd'hui les arbres dont je profiterai demain.",cat:"vision",t:"poetique"},
  {c:"Ma direction compte plus que ma vitesse.",cat:"vision",t:"direct"},
  {c:"Je deviens, jour après jour, la personne que je veux être.",cat:"vision",t:"doux"},

  // ── Citations (vérifie les attributions) ──
  {c:"La vie, c'est comme une bicyclette : il faut avancer pour ne pas perdre l'équilibre.",cat:"citations",t:"poetique",a:"Albert Einstein"},
  {c:"Votre temps est limité, ne le gaspillez pas à vivre la vie de quelqu'un d'autre.",cat:"citations",t:"direct",a:"Steve Jobs"},
  {c:"Cela semble toujours impossible, jusqu'à ce qu'on le fasse.",cat:"citations",t:"percutant",a:"Nelson Mandela"},
  {c:"Un voyage de mille lieues commence toujours par un premier pas.",cat:"citations",t:"poetique",a:"Lao Tseu"},
  {c:"Ce ne sont pas les choses qui nous troublent, mais l'idée que nous nous en faisons.",cat:"citations",t:"direct",a:"Épictète"},
  {c:"La vie d'un homme est ce qu'en font ses pensées.",cat:"citations",t:"poetique",a:"Marc Aurèle"},
  {c:"Ce n'est pas parce que les choses sont difficiles que nous n'osons pas ; c'est parce que nous n'osons pas qu'elles sont difficiles.",cat:"citations",t:"direct",a:"Sénèque"},
  {c:"Ceux qui vivent, ce sont ceux qui luttent.",cat:"citations",t:"percutant",a:"Victor Hugo"},
  {c:"Crois que tu peux et tu as déjà fait la moitié du chemin.",cat:"citations",t:"percutant",a:"Theodore Roosevelt"},
  {c:"Le succès, c'est d'aller d'échec en échec sans perdre son enthousiasme.",cat:"citations",t:"direct",a:"Winston Churchill"},
  {c:"Peu importe la lenteur à laquelle tu avances, tant que tu ne t'arrêtes pas.",cat:"citations",t:"doux",a:"Confucius"},
  {c:"La seule façon de faire du bon travail, c'est d'aimer ce que vous faites.",cat:"citations",t:"doux",a:"Steve Jobs",th:["travail"]},
  {c:"Il n'est pas de vent favorable pour celui qui ne sait où il va.",cat:"citations",t:"direct",a:"Sénèque"},
  {c:"La discipline est le pont entre les objectifs et leur accomplissement.",cat:"citations",t:"direct",a:"Jim Rohn"},
  {c:"Tout ce que l'esprit de l'homme peut concevoir, il peut l'accomplir.",cat:"citations",t:"percutant",a:"Napoleon Hill"},
];

let i = 0, kept = [];
let curCat, curTone, curThemes;

function esc(s){return s.replace(/'/g,"''");}

function render(){
  const stage = document.getElementById('stage');
  const counter = document.getElementById('counter');
  if(i >= POOL.length){
    document.getElementById('actions').style.display='none';
    stage.innerHTML = '<div class="done">terminé — '+kept.length+' affirmations gardées.<br>clique « exporter le SQL ».</div>';
    counter.textContent='';
    return;
  }
  counter.innerHTML = (i+1)+' / '+POOL.length+' · gardées : <b>'+kept.length+'</b>';
  const it = POOL[i];
  curCat = it.cat; curTone = it.t; curThemes = (it.th||[]).slice();

  const catOpts = CATS.map(c=>`<option ${c===curCat?'selected':''}>${c}</option>`).join('');
  const toneOpts = TONES.map(t=>`<option ${t===curTone?'selected':''}>${t}</option>`).join('');
  const chips = THEMES.map(th=>`<span class="chip ${curThemes.includes(th)?'on':''}" onclick="toggleTheme('${th}',this)">${th}</span>`).join('');

  stage.innerHTML = `
    <div class="card">
      <div class="quote">&ldquo;</div>
      <div class="text">${it.c}</div>
      ${it.a?`<div class="author">— ${it.a}</div>`:''}
      <div class="selectors">
        <select id="selCat" onchange="curCat=this.value">${catOpts}</select>
        <select id="selTone" onchange="curTone=this.value">${toneOpts}</select>
      </div>
      <div class="themes">${chips}</div>
    </div>`;
}

function toggleTheme(th,el){
  if(curThemes.includes(th)){curThemes=curThemes.filter(x=>x!==th);el.classList.remove('on');}
  else{curThemes.push(th);el.classList.add('on');}
}

function decide(keep){
  if(i>=POOL.length) return;
  if(keep){
    const it = POOL[i];
    kept.push({c:it.c,cat:curCat,t:curTone,th:curThemes.slice(),a:it.a||null});
  }
  i++;
  render();
}

function exportSql(){
  if(kept.length===0){alert('Aucune affirmation gardée.');return;}
  const rows = kept.map(k=>{
    const themes = '{'+k.th.join(',')+'}';
    const author = k.a ? `'${esc(k.a)}'` : 'null';
    return `('${esc(k.c)}', '${k.cat}', '${k.t}', '${themes}', ${author})`;
  }).join(',\n');
  const sql = `insert into affirmations (content, category, tone, themes, author) values\n${rows};`;
  document.getElementById('sql').value = sql;
  document.getElementById('out').style.display='block';
  document.getElementById('out').scrollIntoView({behavior:'smooth'});
}

function copySql(){
  const ta=document.getElementById('sql');ta.select();
  navigator.clipboard.writeText(ta.value).then(()=>alert('SQL copié !'));
}

document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft')decide(false);
  if(e.key==='ArrowRight')decide(true);
});

render();
</script>
</body>
</html>
