<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Curves — curateur d'affirmations</title>
<style>
  

  
  :root{
    --bg:#0A0A0A; --card:#161615; --ink:#F4F4F1; --dim:#8B8B87;
    --hair:rgba(244,244,241,.15); --accent:#E0A96D;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px}
  h1{font-weight:300;font-size:22px;letter-spacing:.5px;margin:0 0 4px}
  .sub{color:var(--dim);font-size:13px;margin:0 0 18px}
  .counter{color:var(--dim);font-size:13px;margin-bottom:14px}
  .counter b{color:var(--accent)}
  .card{width:min(92vw,460px);min-height:280px;background:var(--card);
    border:1px solid var(--hair);border-radius:22px;padding:26px;display:flex;
    flex-direction:column;gap:16px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
  .quote{font-size:44px;line-height:0;color:var(--accent);opacity:.35;height:26px;font-weight:700}
  .text{font-size:21px;line-height:1.45;font-weight:300;flex:1}
  .author{color:var(--accent);font-size:15px;font-style:italic}
  .fieldrow{display:flex;gap:14px;flex-wrap:wrap}
  .field{display:flex;flex-direction:column;gap:4px}
  .flabel{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim)}
  select{background:#000;color:var(--ink);border:1px solid var(--hair);
    border-radius:10px;padding:8px 10px;font-size:13px}
  .themes{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
  .chip{border:1px solid var(--hair);border-radius:20px;padding:5px 10px;font-size:12px;
    color:var(--dim);cursor:pointer;user-select:none}
  .chip.on{border-color:var(--accent);color:var(--accent)}
  .actions{display:flex;gap:16px;margin-top:22px}
  .btn{width:64px;height:64px;border-radius:50%;border:1px solid var(--hair);
    background:var(--card);color:var(--ink);font-size:24px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;transition:transform .1s}
  .btn:active{transform:scale(.92)}
  .btn.keep{border-color:var(--accent);color:var(--accent)}
  .hint{color:var(--dim);font-size:12px;margin-top:14px}
  .bar{display:flex;gap:10px;margin-top:18px}
  .bar button{background:none;border:1px solid var(--hair);color:var(--dim);
    border-radius:20px;padding:8px 14px;font-size:12px;cursor:pointer}
  #out{width:min(92vw,720px);margin-top:20px;display:none}
  textarea{width:100%;height:280px;background:#000;color:var(--ink);border:1px solid var(--hair);
    border-radius:12px;padding:14px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
  .done{text-align:center;color:var(--dim);font-size:15px;margin-top:30px}
  .warn{color:#E0A96D;font-size:12px;max-width:460px;text-align:center;margin-top:16px;opacity:.8}
</style>
</head>
<body>
  <h1>curves · curateur</h1>
  <p class="sub">garde ou jette — les gardées deviennent ton SQL Supabase</p>
  <div class="counter" id="counter"></div>

  <div id="stage"></div>

  <div class="actions" id="actions">
    <button class="btn" onclick="decide(false)" title="jeter (←)">✗</button>
    <button class="btn keep" onclick="decide(true)" title="garder (→)">♥</button>
  </div>
  <div class="hint">← jeter · → garder · les menus ajustent catégorie / ton / thèmes avant de garder</div>

  <div class="bar">
    <button onclick="exportSql()">exporter le SQL</button>
    <button onclick="if(confirm('Recommencer depuis le début ?')){kept=[];i=0;render();}">recommencer</button>
  </div>
  <p class="warn">⚠️ Vérifie les citations : certaines attributions populaires sont incertaines. Jette celles dont tu n'es pas sûr.</p>

  <div id="out">
    <textarea id="sql" readonly></textarea>
    <div class="bar"><button onclick="copySql()">copier</button></div>
  </div>

<script>
const CATS = ["general","mindset","action","focus","resilience","confidence","vision","citations"];
const TONES = ["direct","doux","poetique","percutant"];
const THEMES = ["travail","famille","relations","sante","argent"];

// Pool à trier. th = thèmes (souvent vide), a = auteur (citations).
const POOL = [
  // ── Général ──
  {c:"Je n'ai pas à tout comprendre pour avancer.",cat:"general",t:"doux"},
  {c:"Ce que je répète chaque jour dessine qui je deviens.",cat:"general",t:"poetique"},
  {c:"Aujourd'hui, un geste suffit.",cat:"general",t:"percutant"},
  {c:"Je m'accorde le droit d'être un travail en cours.",cat:"general",t:"doux"},
  {c:"Le mieux ne se joue pas en un jour, mais chaque jour.",cat:"general",t:"direct"},
  {c:"Je pose ce que je ne peux pas porter aujourd'hui.",cat:"general",t:"doux"},
  {c:"Rien ne presse autant que je le crois.",cat:"general",t:"doux"},
  {c:"Je choisis mes batailles, pas toutes les batailles.",cat:"general",t:"direct"},
  {c:"Ma journée commence à l'instant où je le décide.",cat:"general",t:"percutant"},
  {c:"Il y a de la beauté dans le simple fait d'essayer.",cat:"general",t:"poetique"},
  {c:"Je fais la paix avec ce qui ne dépend pas de moi.",cat:"general",t:"doux"},
  {c:"Un jour ordinaire bien vécu, c'est déjà une victoire.",cat:"general",t:"doux"},

  // ── Mindset ──
  {c:"Je ne suis pas en retard sur ma vie.",cat:"mindset",t:"doux"},
  {c:"Une pensée n'est vraie que si je la nourris.",cat:"mindset",t:"direct"},
  {c:"Je peux tenir deux choses à la fois : la peur et le courage.",cat:"mindset",t:"poetique"},
  {c:"Ce n'est pas « je n'y arrive pas », c'est « je n'y arrive pas encore ».",cat:"mindset",t:"direct"},
  {c:"Je troque la perfection contre le progrès.",cat:"mindset",t:"percutant"},
  {c:"Mes limites d'hier ne décident pas de mes possibles d'aujourd'hui.",cat:"mindset",t:"direct"},
  {c:"Le regard des autres n'est pas un verdict.",cat:"mindset",t:"doux"},
  {c:"Chaque difficulté cache une compétence à gagner.",cat:"mindset",t:"direct"},
  {c:"Je m'autorise à recommencer autant de fois qu'il le faut.",cat:"mindset",t:"doux"},
  {c:"Ce que je crois de moi devient la carte de ma vie.",cat:"mindset",t:"poetique"},
  {c:"Je réponds, je ne réagis pas.",cat:"mindset",t:"percutant"},

  // ── Action ──
  {c:"L'action dissout la peur bien mieux que la réflexion.",cat:"action",t:"direct"},
  {c:"Fais la version brouillon. Tu corrigeras après.",cat:"action",t:"direct"},
  {c:"Un pas imparfait bat mille pas imaginés.",cat:"action",t:"percutant"},
  {c:"Je commence avant de me sentir prêt.",cat:"action",t:"percutant"},
  {c:"La discipline, c'est se choisir même sans envie.",cat:"action",t:"direct"},
  {c:"Range d'abord, réfléchis ensuite.",cat:"action",t:"percutant"},
  {c:"Ce que je remets à demain me pèse aujourd'hui.",cat:"action",t:"direct"},
  {c:"Je fais la chose difficile en premier.",cat:"action",t:"percutant",th:["travail"]},
  {c:"Petit et régulier bat grand et rare.",cat:"action",t:"direct"},
  {c:"Je n'attends pas l'inspiration, je m'assois et je travaille.",cat:"action",t:"direct",th:["travail"]},
  {c:"Le premier pas n'a pas besoin d'être beau, juste fait.",cat:"action",t:"doux"},

  // ── Focus ──
  {c:"Dire non à ceci, c'est dire oui à l'essentiel.",cat:"focus",t:"direct"},
  {c:"Je fais moins de choses, mais je les fais bien.",cat:"focus",t:"percutant"},
  {c:"Mon téléphone peut attendre. Pas ma vie.",cat:"focus",t:"percutant"},
  {c:"Une tâche ouverte à la fois.",cat:"focus",t:"direct",th:["travail"]},
  {c:"Je reviens au présent sans me juger d'en être parti.",cat:"focus",t:"doux"},
  {c:"La clarté vient quand je retire le superflu.",cat:"focus",t:"poetique"},
  {c:"Ce que j'arrose grandit ; je choisis quoi arroser.",cat:"focus",t:"poetique"},
  {c:"Profondeur plutôt que dispersion.",cat:"focus",t:"percutant"},
  {c:"Le silence est un allié, pas un vide.",cat:"focus",t:"poetique"},

  // ── Résilience ──
  {c:"Je peux traverser ça, une heure à la fois.",cat:"resilience",t:"doux"},
  {c:"Mes cicatrices prouvent que j'ai guéri.",cat:"resilience",t:"poetique"},
  {c:"Ce n'est pas la fin, juste un passage étroit.",cat:"resilience",t:"doux"},
  {c:"Demander de l'aide est un acte de force.",cat:"resilience",t:"direct",th:["relations"]},
  {c:"La vague passe toujours. Je tiens.",cat:"resilience",t:"poetique"},
  {c:"Je me relève, encore, parce que je le peux.",cat:"resilience",t:"percutant"},
  {c:"Mon corps mérite du repos, pas des reproches.",cat:"resilience",t:"doux",th:["sante"]},
  {c:"Les jours sombres font partie du ciel aussi.",cat:"resilience",t:"poetique"},
  {c:"Je n'ai pas à être fort tout le temps.",cat:"resilience",t:"doux"},
  {c:"Ce qui me traverse ne me définit pas.",cat:"resilience",t:"direct"},
  {c:"J'avance à mon rythme, et c'est le bon.",cat:"resilience",t:"doux"},

  // ── Confiance ──
  {c:"Je vaux la peine qu'on fasse des efforts pour moi.",cat:"confidence",t:"doux",th:["relations"]},
  {c:"Je m'exprime, même quand ma voix tremble.",cat:"confidence",t:"doux"},
  {c:"Mon avis a de la valeur, ici comme ailleurs.",cat:"confidence",t:"direct",th:["travail"]},
  {c:"Je n'ai pas à me rapetisser pour rassurer les autres.",cat:"confidence",t:"percutant"},
  {c:"Je me fais confiance pour gérer ce qui viendra.",cat:"confidence",t:"direct"},
  {c:"Je suis un allié pour moi-même, pas un juge.",cat:"confidence",t:"doux"},
  {c:"Je mérite d'occuper l'espace que je prends.",cat:"confidence",t:"percutant"},
  {c:"Mes qualités existent même les jours où je les oublie.",cat:"confidence",t:"doux"},
  {c:"Je choisis de croire en moi avant d'avoir la preuve.",cat:"confidence",t:"poetique"},
  {c:"Je pose mes limites sans me justifier.",cat:"confidence",t:"direct",th:["relations"]},
  {c:"Être imparfait ne me rend pas moins digne.",cat:"confidence",t:"doux"},

  // ── Vision ──
  {c:"Je bâtis ma vie une brique à la fois.",cat:"vision",t:"direct"},
  {c:"Mon avenir se décide dans mes gestes d'aujourd'hui.",cat:"vision",t:"direct"},
  {c:"Je garde le cap, même quand la mer bouge.",cat:"vision",t:"poetique"},
  {c:"Je m'autorise à vouloir grand.",cat:"vision",t:"percutant"},
  {c:"Ce que je répète en secret finit par se voir.",cat:"vision",t:"poetique"},
  {c:"Chaque « oui » à mes rêves demande un « non » ailleurs.",cat:"vision",t:"direct"},
  {c:"Je sème maintenant ce que je récolterai plus tard.",cat:"vision",t:"poetique"},
  {c:"Ma vie est un projet dont je suis l'auteur.",cat:"vision",t:"direct"},
  {c:"Je n'ai pas à voir toute l'échelle pour monter la première marche.",cat:"vision",t:"doux"},

  // ── Citations (vérifie les attributions) ──
  {c:"On ne voit bien qu'avec le cœur. L'essentiel est invisible pour les yeux.",cat:"citations",t:"poetique",a:"Antoine de Saint-Exupéry"},
  {c:"Fais de ta vie un rêve, et d'un rêve une réalité.",cat:"citations",t:"poetique",a:"Antoine de Saint-Exupéry"},
  {c:"Nous souffrons plus souvent en imagination qu'en réalité.",cat:"citations",t:"direct",a:"Sénèque"},
  {c:"Tu as pouvoir sur ton esprit, pas sur les événements. Prends-en conscience, et tu trouveras la force.",cat:"citations",t:"direct",a:"Marc Aurèle"},
  {c:"Ne cherche pas que les choses arrivent comme tu le veux ; veuille qu'elles arrivent comme elles arrivent, et ta vie sera sereine.",cat:"citations",t:"doux",a:"Épictète"},
  {c:"La force ne vient pas des capacités physiques, mais d'une volonté indomptable.",cat:"citations",t:"percutant",a:"Mahatma Gandhi"},
  {c:"Ce qui est derrière nous et ce qui est devant nous sont peu de chose comparés à ce qui est en nous.",cat:"citations",t:"poetique",a:"Ralph Waldo Emerson"},
  {c:"Rien de grand ne s'est accompli dans le monde sans passion.",cat:"citations",t:"percutant",a:"Georg Hegel"},
  {c:"Que tu penses en être capable ou non, dans les deux cas tu as raison.",cat:"citations",t:"direct",a:"Henry Ford"},
  {c:"N'abandonnez jamais. Jamais, jamais, jamais.",cat:"citations",t:"percutant",a:"Winston Churchill"},
  {c:"Le vrai voyage de découverte ne consiste pas à chercher de nouveaux paysages, mais à avoir de nouveaux yeux.",cat:"citations",t:"poetique",a:"Marcel Proust"},
  {c:"La liberté commence là où finit l'ignorance.",cat:"citations",t:"direct",a:"Victor Hugo"},
  {c:"Fais ce que tu peux, avec ce que tu as, là où tu es.",cat:"citations",t:"direct",a:"Theodore Roosevelt"},
  {c:"Connais-toi toi-même.",cat:"citations",t:"percutant",a:"Socrate"},
  {c:"Nous sommes ce que nous pensons ; tout ce que nous sommes naît de nos pensées.",cat:"citations",t:"poetique",a:"Bouddha"},
  {c:"Le bonheur de ta vie dépend de la qualité de tes pensées.",cat:"citations",t:"doux",a:"Marc Aurèle"},
  {c:"Ce n'est pas la montagne que l'on conquiert, mais soi-même.",cat:"citations",t:"percutant",a:"Edmund Hillary"},
  {c:"L'obstacle est le chemin.",cat:"citations",t:"percutant",a:"Marc Aurèle"},
];

let i = 0, kept = [];
let curCat, curTone, curThemes;

function esc(s){return s.replace(/'/g,"''");}

function render(){
  const stage = document.getElementById('stage');
  const counter = document.getElementById('counter');
  if(i >= POOL.length){
    document.getElementById('actions').style.display='none';
    stage.innerHTML = '<div class="done">terminé — '+kept.length+' affirmations gardées.<br>clique « exporter le SQL ».</div>';
    counter.textContent='';
    return;
  }
  counter.innerHTML = (i+1)+' / '+POOL.length+' · gardées : <b>'+kept.length+'</b>';
  const it = POOL[i];
  curCat = it.cat; curTone = it.t; curThemes = (it.th||[]).slice();

  const catOpts = CATS.map(c=>`<option ${c===curCat?'selected':''}>${c}</option>`).join('');
  const toneOpts = TONES.map(t=>`<option ${t===curTone?'selected':''}>${t}</option>`).join('');
  const chips = THEMES.map(th=>`<span class="chip ${curThemes.includes(th)?'on':''}" onclick="toggleTheme('${th}',this)">${th}</span>`).join('');

  stage.innerHTML = `
    <div class="card">
      <div class="quote">&ldquo;</div>
      <div class="text">${it.c}</div>
      ${it.a?`<div class="author">— ${it.a}</div>`:''}
      <div class="fieldrow">
        <div class="field"><span class="flabel">catégorie</span>
          <select id="selCat" onchange="curCat=this.value">${catOpts}</select></div>
        <div class="field"><span class="flabel">ton</span>
          <select id="selTone" onchange="curTone=this.value">${toneOpts}</select></div>
      </div>
      <div class="field"><span class="flabel">thèmes</span>
        <div class="themes">${chips}</div></div>
    </div>`;
}

function toggleTheme(th,el){
  if(curThemes.includes(th)){curThemes=curThemes.filter(x=>x!==th);el.classList.remove('on');}
  else{curThemes.push(th);el.classList.add('on');}
}

function decide(keep){
  if(i>=POOL.length) return;
  if(keep){
    const it = POOL[i];
    kept.push({c:it.c,cat:curCat,t:curTone,th:curThemes.slice(),a:it.a||null});
  }
  i++;
  render();
}

function exportSql(){
  if(kept.length===0){alert('Aucune affirmation gardée.');return;}
  const rows = kept.map(k=>{
    const themes = '{'+k.th.join(',')+'}';
    const author = k.a ? `'${esc(k.a)}'` : 'null';
    return `('${esc(k.c)}', '${k.cat}', '${k.t}', '${themes}', ${author})`;
  }).join(',\n');
  const sql = `insert into affirmations (content, category, tone, themes, author) values\n${rows};`;
  document.getElementById('sql').value = sql;
  document.getElementById('out').style.display='block';
  document.getElementById('out').scrollIntoView({behavior:'smooth'});
}

function copySql(){
  const ta=document.getElementById('sql');ta.select();
  navigator.clipboard.writeText(ta.value).then(()=>alert('SQL copié !'));
}

document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft')decide(false);
  if(e.key==='ArrowRight')decide(true);
});

render();
</script>
</body>
</html>
