<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Curves — curateur d'affirmations</title>
<style>
  

  
  :root{
    --bg:#0A0A0A; --card:#161615; --ink:#F4F4F1; --dim:#8B8B87;
    --hair:rgba(244,244,241,.15); --accent:#E0A96D;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px}
  h1{font-weight:300;font-size:22px;letter-spacing:.5px;margin:0 0 4px}
  .sub{color:var(--dim);font-size:13px;margin:0 0 18px}
  .counter{color:var(--dim);font-size:13px;margin-bottom:14px}
  .counter b{color:var(--accent)}
  .card{width:min(92vw,460px);min-height:280px;background:var(--card);
    border:1px solid var(--hair);border-radius:22px;padding:26px;display:flex;
    flex-direction:column;gap:16px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
  .quote{font-size:44px;line-height:0;color:var(--accent);opacity:.35;height:26px;font-weight:700}
  .text{font-size:21px;line-height:1.45;font-weight:300;flex:1}
  .author{color:var(--accent);font-size:15px;font-style:italic}
  .fieldrow{display:flex;gap:14px;flex-wrap:wrap}
  .field{display:flex;flex-direction:column;gap:4px}
  .flabel{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim)}
  select{background:#000;color:var(--ink);border:1px solid var(--hair);
    border-radius:10px;padding:8px 10px;font-size:13px}
  .themes{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
  .chip{border:1px solid var(--hair);border-radius:20px;padding:5px 10px;font-size:12px;
    color:var(--dim);cursor:pointer;user-select:none}
  .chip.on{border-color:var(--accent);color:var(--accent)}
  .actions{display:flex;gap:16px;margin-top:22px}
  .btn{width:64px;height:64px;border-radius:50%;border:1px solid var(--hair);
    background:var(--card);color:var(--ink);font-size:24px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;transition:transform .1s}
  .btn:active{transform:scale(.92)}
  .btn.keep{border-color:var(--accent);color:var(--accent)}
  .hint{color:var(--dim);font-size:12px;margin-top:14px}
  .bar{display:flex;gap:10px;margin-top:18px}
  .bar button{background:none;border:1px solid var(--hair);color:var(--dim);
    border-radius:20px;padding:8px 14px;font-size:12px;cursor:pointer}
  #out{width:min(92vw,720px);margin-top:20px;display:none}
  textarea{width:100%;height:280px;background:#000;color:var(--ink);border:1px solid var(--hair);
    border-radius:12px;padding:14px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
  .done{text-align:center;color:var(--dim);font-size:15px;margin-top:30px}
  .warn{color:#E0A96D;font-size:12px;max-width:460px;text-align:center;margin-top:16px;opacity:.8}
</style>
</head>
<body>
  <h1>curves · curateur</h1>
  <p class="sub">garde ou jette — les gardées deviennent ton SQL Supabase</p>
  <div class="counter" id="counter"></div>

  <div id="stage"></div>

  <div class="actions" id="actions">
    <button class="btn" onclick="decide(false)" title="jeter (←)">✗</button>
    <button class="btn keep" onclick="decide(true)" title="garder (→)">♥</button>
  </div>
  <div class="hint">← jeter · → garder · les menus ajustent catégorie / ton / thèmes avant de garder</div>

  <div class="bar">
    <button onclick="exportSql()">exporter le SQL</button>
    <button onclick="if(confirm('Recommencer depuis le début ?')){kept=[];i=0;render();}">recommencer</button>
  </div>
  <p class="warn">⚠️ Vérifie les citations : certaines attributions populaires sont incertaines. Jette celles dont tu n'es pas sûr.</p>

  <div id="out">
    <textarea id="sql" readonly></textarea>
    <div class="bar"><button onclick="copySql()">copier</button></div>
  </div>

<script>
const CATS = ["general","mindset","action","focus","resilience","confidence","vision","citations"];
const TONES = ["direct","doux","poetique","percutant"];
const THEMES = ["travail","famille","relations","sante","argent"];

// Pool à trier. th = thèmes (souvent vide), a = auteur (citations).
const POOL = [
  // ── Focus (renfort) ──
  {c:"Je choisis une priorité, pas dix.",cat:"focus",t:"direct"},
  {c:"Ce que je commence, je le finis avant d'ouvrir autre chose.",cat:"focus",t:"direct",th:["travail"]},
  {c:"Ranger mon espace, c'est ranger mon esprit.",cat:"focus",t:"poetique"},
  {c:"Je coupe le bruit pour entendre l'essentiel.",cat:"focus",t:"percutant"},
  {c:"Une heure concentrée vaut une journée dispersée.",cat:"focus",t:"direct",th:["travail"]},
  {c:"Je fais une pause avant de me disperser.",cat:"focus",t:"doux"},
  {c:"Mon attention va là où je la pose, pas là où on la tire.",cat:"focus",t:"direct"},
  {c:"Je protège mes matins comme un trésor.",cat:"focus",t:"poetique"},
  {c:"Terminer vaut mieux que multiplier.",cat:"focus",t:"percutant"},
  {c:"Je respire trois fois avant de me remettre au travail.",cat:"focus",t:"doux"},
  {c:"Le calme est ma vitesse de croisière.",cat:"focus",t:"poetique"},
  {c:"Je fais de la place au silence.",cat:"focus",t:"doux"},
  {c:"Moins d'onglets, plus de vie.",cat:"focus",t:"percutant"},

  // ── Vision (renfort) ──
  {c:"Je décide qui je veux devenir, puis j'agis en conséquence.",cat:"vision",t:"direct"},
  {c:"Mes petits choix d'aujourd'hui bâtissent mes grands jours.",cat:"vision",t:"poetique"},
  {c:"Je regarde loin sans lâcher le pas d'après.",cat:"vision",t:"direct"},
  {c:"Ce que je vise avec clarté finit par prendre forme.",cat:"vision",t:"poetique"},
  {c:"Je m'autorise des rêves plus grands que mes doutes.",cat:"vision",t:"percutant"},
  {c:"Ma vie ressemble de plus en plus à ce que je choisis.",cat:"vision",t:"doux"},
  {c:"Je trace ma route, même sans carte.",cat:"vision",t:"poetique"},
  {c:"Chaque jour me rapproche de la personne que je veux être.",cat:"vision",t:"doux"},
  {c:"Je préfère un cap imparfait à une dérive confortable.",cat:"vision",t:"direct"},
  {c:"Le futur que je veux se construit à cet instant.",cat:"vision",t:"percutant"},
  {c:"Je vaux la peine des efforts que je fais pour mes rêves.",cat:"vision",t:"doux"},
  {c:"Voir grand ne coûte rien, sauf le courage de commencer.",cat:"vision",t:"direct"},
  {c:"Je sème patiemment ce que je veux récolter.",cat:"vision",t:"poetique"},

  // ── Mindset (renfort) ──
  {c:"Je ne suis pas obligé de croire tout ce que je pense.",cat:"mindset",t:"direct"},
  {c:"Un revers est une donnée, pas une sentence.",cat:"mindset",t:"direct"},
  {c:"Je peux avoir peur et le faire quand même.",cat:"mindset",t:"percutant"},
  {c:"Mon histoire n'est pas finie d'écrire.",cat:"mindset",t:"poetique"},
  {c:"Je me compare à moi d'hier, pas aux autres.",cat:"mindset",t:"direct"},
  {c:"Chaque erreur m'apprend un chemin de moins à reprendre.",cat:"mindset",t:"doux"},
  {c:"Le talent s'entretient, l'effort se cultive.",cat:"mindset",t:"direct"},
  {c:"Je transforme « et si j'échoue » en « et si ça marche ».",cat:"mindset",t:"percutant"},
  {c:"Ce qui me dérange a souvent quelque chose à m'apprendre.",cat:"mindset",t:"doux"},
  {c:"Je garde l'esprit ouvert, surtout quand j'ai tort.",cat:"mindset",t:"direct"},

  // ── Confiance (renfort) ──
  {c:"Je n'ai pas besoin d'être parfait pour être légitime.",cat:"confidence",t:"doux"},
  {c:"Ma présence a de la valeur, même en silence.",cat:"confidence",t:"poetique"},
  {c:"Je dis ce que je pense avec calme et fermeté.",cat:"confidence",t:"direct",th:["relations"]},
  {c:"Je me tiens droit dans mes choix.",cat:"confidence",t:"percutant"},
  {c:"Je m'appuie sur mes réussites, pas seulement sur mes peurs.",cat:"confidence",t:"doux"},
  {c:"Personne ne définit ma valeur à ma place.",cat:"confidence",t:"percutant"},
  {c:"Je demande ce dont j'ai besoin, sans culpabiliser.",cat:"confidence",t:"direct",th:["relations"]},
  {c:"Je m'habitue à recevoir aussi, pas seulement à donner.",cat:"confidence",t:"doux"},
  {c:"J'ai le droit de prendre de la place au travail.",cat:"confidence",t:"direct",th:["travail"]},
  {c:"Je me choisis, même quand c'est inconfortable.",cat:"confidence",t:"percutant"},

  // ── Général (renfort) ──
  {c:"Aujourd'hui, je vise le suffisant, pas le parfait.",cat:"general",t:"doux"},
  {c:"Je laisse de la place à l'imprévu.",cat:"general",t:"poetique"},
  {c:"Une bonne journée se construit d'abord dans la tête.",cat:"general",t:"direct"},
  {c:"Je célèbre les petites choses qui vont bien.",cat:"general",t:"doux"},
  {c:"Le repos fait partie du travail.",cat:"general",t:"direct"},
  {c:"Je peux tout recommencer à midi si le matin a raté.",cat:"general",t:"doux"},
  {c:"Ce que je nourris grandit ; je nourris le bon.",cat:"general",t:"poetique"},
  {c:"Avancer un peu vaut mieux que ne pas bouger.",cat:"general",t:"percutant"},
  {c:"Je m'offre de la douceur les jours difficiles.",cat:"general",t:"doux",th:["sante"]},

  // ── Action (renfort) ──
  {c:"Je fais aujourd'hui ce que mon futur moi me remerciera d'avoir fait.",cat:"action",t:"direct"},
  {c:"Deux minutes suffisent pour briser l'inertie.",cat:"action",t:"percutant"},
  {c:"Je préfère agir et ajuster que planifier sans fin.",cat:"action",t:"direct"},
  {c:"Le mouvement crée la clarté.",cat:"action",t:"poetique"},
  {c:"J'attaque la tâche que j'évite depuis trois jours.",cat:"action",t:"percutant",th:["travail"]},
  {c:"Fini vaut mieux que parfait, encore et toujours.",cat:"action",t:"percutant"},
  {c:"Je transforme un projet en un premier appel, un premier mail, un premier pas.",cat:"action",t:"direct",th:["travail"]},
  {c:"Chaque jour, une brique de plus.",cat:"action",t:"doux"},

  // ── Résilience (renfort) ──
  {c:"Je tiens un jour de plus, et c'est déjà énorme.",cat:"resilience",t:"doux"},
  {c:"Ce qui me fait plier ne me fait pas rompre.",cat:"resilience",t:"percutant"},
  {c:"J'ai le droit de ralentir sans culpabiliser.",cat:"resilience",t:"doux",th:["sante"]},
  {c:"Les tempêtes passent, les racines restent.",cat:"resilience",t:"poetique"},
  {c:"Je me traite avec la douceur que j'offrirais à un ami.",cat:"resilience",t:"doux"},
  {c:"Je n'ai pas à avoir toutes les réponses aujourd'hui.",cat:"resilience",t:"doux"},
  {c:"Ma valeur ne baisse pas les jours sans énergie.",cat:"resilience",t:"direct",th:["sante"]},
  {c:"Après cette étape, je serai plus solide.",cat:"resilience",t:"direct"},
];

let i = 0, kept = [];
let curCat, curTone, curThemes;

function esc(s){return s.replace(/'/g,"''");}

function render(){
  const stage = document.getElementById('stage');
  const counter = document.getElementById('counter');
  if(i >= POOL.length){
    document.getElementById('actions').style.display='none';
    stage.innerHTML = '<div class="done">terminé — '+kept.length+' affirmations gardées.<br>clique « exporter le SQL ».</div>';
    counter.textContent='';
    return;
  }
  counter.innerHTML = (i+1)+' / '+POOL.length+' · gardées : <b>'+kept.length+'</b>';
  const it = POOL[i];
  curCat = it.cat; curTone = it.t; curThemes = (it.th||[]).slice();

  const catOpts = CATS.map(c=>`<option ${c===curCat?'selected':''}>${c}</option>`).join('');
  const toneOpts = TONES.map(t=>`<option ${t===curTone?'selected':''}>${t}</option>`).join('');
  const chips = THEMES.map(th=>`<span class="chip ${curThemes.includes(th)?'on':''}" onclick="toggleTheme('${th}',this)">${th}</span>`).join('');

  stage.innerHTML = `
    <div class="card">
      <div class="quote">&ldquo;</div>
      <div class="text">${it.c}</div>
      ${it.a?`<div class="author">— ${it.a}</div>`:''}
      <div class="fieldrow">
        <div class="field"><span class="flabel">catégorie</span>
          <select id="selCat" onchange="curCat=this.value">${catOpts}</select></div>
        <div class="field"><span class="flabel">ton</span>
          <select id="selTone" onchange="curTone=this.value">${toneOpts}</select></div>
      </div>
      <div class="field"><span class="flabel">thèmes</span>
        <div class="themes">${chips}</div></div>
    </div>`;
}

function toggleTheme(th,el){
  if(curThemes.includes(th)){curThemes=curThemes.filter(x=>x!==th);el.classList.remove('on');}
  else{curThemes.push(th);el.classList.add('on');}
}

function decide(keep){
  if(i>=POOL.length) return;
  if(keep){
    const it = POOL[i];
    kept.push({c:it.c,cat:curCat,t:curTone,th:curThemes.slice(),a:it.a||null});
  }
  i++;
  render();
}

function exportSql(){
  if(kept.length===0){alert('Aucune affirmation gardée.');return;}
  const rows = kept.map(k=>{
    const themes = '{'+k.th.join(',')+'}';
    const author = k.a ? `'${esc(k.a)}'` : 'null';
    return `('${esc(k.c)}', '${k.cat}', '${k.t}', '${themes}', ${author})`;
  }).join(',\n');
  const sql = `insert into affirmations (content, category, tone, themes, author) values\n${rows};`;
  document.getElementById('sql').value = sql;
  document.getElementById('out').style.display='block';
  document.getElementById('out').scrollIntoView({behavior:'smooth'});
}

function copySql(){
  const ta=document.getElementById('sql');ta.select();
  navigator.clipboard.writeText(ta.value).then(()=>alert('SQL copié !'));
}

document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft')decide(false);
  if(e.key==='ArrowRight')decide(true);
});

render();
</script>
</body>
</html>
